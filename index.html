<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Recall: Duel Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');
      body {
        font-family: 'Noto Sans JP', sans-serif;
        background-color: #1a0b0b;
        color: #e5e5e5;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2d1b1b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #881313; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aa1818; 
      }

      /* --- Card Animations --- */
      
      /* Play Card: Slide up and fade in */
      @keyframes slide-up-fade {
        0% { transform: translateY(20px) scale(0.9); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      .animate-play-card {
        animation: slide-up-fade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      }

      /* Draw Card: Slide in from bottom with rotation */
      @keyframes draw-in {
        0% { transform: translateY(60px) rotate(10deg); opacity: 0; }
        100% { transform: translateY(0) rotate(0); opacity: 1; }
      }
      .animate-draw {
        animation: draw-in 0.5s ease-out backwards;
      }

      /* Attack/Battle: Aggressive shake */
      @keyframes shake-hard {
        0% { transform: translate(0, 0) rotate(0); }
        10% { transform: translate(-2px, -2px) rotate(-2deg); }
        20% { transform: translate(2px, 2px) rotate(2deg); }
        30% { transform: translate(-2px, 2px) rotate(-2deg); }
        40% { transform: translate(2px, -2px) rotate(2deg); }
        50% { transform: translate(-2px, 0) rotate(-2deg); }
        60% { transform: translate(2px, 0) rotate(2deg); }
        70% { transform: translate(0, 2px) rotate(0); }
        80% { transform: translate(-2px, 0) rotate(-1deg); }
        90% { transform: translate(2px, 0) rotate(1deg); }
        100% { transform: translate(0, 0) rotate(0); }
      }
      .animate-shake {
        animation: shake-hard 0.5s ease-in-out infinite;
      }

      /* General Fade In */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      
      @keyframes fadeInDown {
          from { opacity: 0; transform: translateY(-20px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down {
          animation: fadeInDown 0.8s ease-out forwards;
      }

      @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
          animation: fadeInUp 0.8s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
